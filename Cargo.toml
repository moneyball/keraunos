[package]
name = "keraunos"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
description = "A from-scratch Lightning Network protocol implementation in Rust with a sans-I/O, deterministic core"
keywords = ["lightning", "bitcoin", "bolt", "payments"]
categories = ["cryptography::cryptocurrencies", "network-programming"]

[dependencies]
secp256k1 = { version = "0.29", features = ["recovery"] }
getrandom = "0.2"

[dev-dependencies]
bitcoin = "0.32.100"
lightning = "0.2.2"
lightning-invoice = "0.34.0"
serde_json = "1.0.150"

[profile.test]
opt-level = 1

[lints.rust]
unsafe_code = "forbid"
